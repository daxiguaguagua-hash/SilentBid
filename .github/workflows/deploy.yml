name: CI Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: silentbid-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::297041783557:role/GitHubActionsSilentBidDeploy
  DEPLOY_BUCKET: silentbid-deploy-artifacts-297041783557-us-east-2
  DEPLOY_INSTANCE_ID: i-092e6b041c0940e4c
  VITE_CONTRACT_ADDRESS: "0xCE06943bF0A1a5bfb409e50b00466abb6fc24F85"

jobs:
  test:
    name: Test contracts and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install contract dependencies
        run: npm ci

      - name: Test contracts
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm run test

  deploy:
    name: Deploy frontend to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package artifact
        run: tar -C frontend/dist -czf /tmp/silentbid-dist.tgz .

      - name: Upload artifact to S3
        run: aws s3 cp /tmp/silentbid-dist.tgz "s3://${DEPLOY_BUCKET}/silentbid-dist-${GITHUB_SHA}.tgz"

      - name: Deploy through SSM
        run: |
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${DEPLOY_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SilentBid ${GITHUB_SHA}" \
            --parameters commands="aws s3 cp s3://${DEPLOY_BUCKET}/silentbid-dist-${GITHUB_SHA}.tgz /tmp/silentbid-dist.tgz,sudo mkdir -p /var/www/silentbid,sudo rm -rf /var/www/silentbid/*,sudo tar -xzf /tmp/silentbid-dist.tgz -C /var/www/silentbid,sudo chown -R nginx:nginx /var/www/silentbid,sudo systemctl reload nginx" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${DEPLOY_INSTANCE_ID}"
